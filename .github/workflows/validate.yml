name: Validate Watch Clock
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [cyd, guition, jc1060p470, jc1060p470v2, jc8012p4a1]
    env:
      TESSERA_TREE: ${{ github.workspace }}/.research/tessera
      TESSERA_MANIFEST: ${{ github.workspace }}/.research/tessera/screen_manager/app/plugin_manifest.py
      TESSERA_BOARDS: ${{ github.workspace }}/.research/tessera/screen_manager/app/boards.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          ref: 85112ffc7d9146d33fe6ee22c6f3faec710ed80a
          path: .research/tessera-plugins
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/homeassistant_espscreen
          ref: 9f6ab3c68d420f454fb905466696063b1d789049
          path: .research/tessera
      - run: pip install pyyaml
      - name: Check manifest and drawing rules
        run: python .research/tessera-plugins/tools/check.py .
      - name: Test native geometry
        run: python tools/test.py
      - name: Install preview dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Preview real firmware
        run: python .research/tessera-plugins/tools/preview.py . --board ${{ matrix.board }} --strict
      - name: Generate real ESP32 firmware from upstream URLs
        if: matrix.board == 'guition'
        env:
          TESSERA_CODEGEN_REF: 9f6ab3c68d420f454fb905466696063b1d789049
        run: .research/tessera-plugins/tools/.cache/preview-venv/bin/python tools/check_upstream_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-clock-${{ matrix.board }}
          path: .preview/
          include-hidden-files: true
          if-no-files-found: ignore
  store:
    needs: preview
    runs-on: ubuntu-latest
    env:
      TESSERA_TREE: ${{ github.workspace }}/.research/tessera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          ref: 85112ffc7d9146d33fe6ee22c6f3faec710ed80a
          path: .research/tessera-plugins
      - run: pip install pyyaml pillow
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/homeassistant_espscreen
          ref: 9f6ab3c68d420f454fb905466696063b1d789049
          path: .research/tessera
          sparse-checkout: fonts
      - uses: actions/download-artifact@v4
        with:
          pattern: watch-clock-*
          path: .research/bench-results
      - run: python tools/merge_previews.py .research/bench-results .preview
      - run: python .research/tessera-plugins/tools/store_image.py . --from .preview
      - uses: actions/upload-artifact@v4
        with:
          name: watch-clock-preview
          path: |
            .preview/
            store.png
          include-hidden-files: true

